services:
  db:
    image: postgres:15-alpine
    container_name: vlab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vlab_user
      POSTGRES_PASSWORD: vlab_password
      POSTGRES_DB: vlab_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlab_user -d vlab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vlab_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=vlab_db
      - DB_USERNAME=vlab_user
      - DB_PASSWORD=vlab_password
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - API_AUTH_ENABLED=false
      - VLAB_SUMMARY_CACHE_SECONDS=15
      - VLAB_LIST_CACHE_SECONDS=30
      - CACHE_STORE=file
      - SESSION_DRIVER=array
      - QUEUE_CONNECTION=sync
      - PHP_CLI_SERVER_WORKERS=4
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: node:20-alpine
    container_name: vlab_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    command: >
      sh -c "
        npm install &&
        npm run dev -- --host 0.0.0.0
      "

volumes:
  vlab_pgdata:
