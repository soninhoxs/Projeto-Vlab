services:
  db:
    image: postgres:15-alpine
    container_name: vlab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vlab_user
      POSTGRES_PASSWORD: vlab_password
      POSTGRES_DB: vlab_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlab_user -d vlab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vlab-backend
    container_name: vlab_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - vlab_vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=vlab_db
      - DB_USERNAME=vlab_user
      - DB_PASSWORD=vlab_password
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - API_AUTH_ENABLED=false
      - VLAB_SUMMARY_CACHE_SECONDS=15
      - VLAB_LIST_CACHE_SECONDS=30
      - CACHE_STORE=array
      - SESSION_DRIVER=array
      - QUEUE_CONNECTION=database
      - PHP_CLI_SERVER_WORKERS=8
      - LOG_CHANNEL=stderr
      - LOG_STACK=stderr
      - LOG_LEVEL=warning
      - LOG_HTTP_ENABLED=true
      - LOG_HTTP_CHANNEL=api_stderr
      - LOG_API_LEVEL=info
      - LOG_HTTP_SKIP_FAST_INDEX=false
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  queue:
    image: vlab-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vlab_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - vlab_vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=vlab_db
      - DB_USERNAME=vlab_user
      - DB_PASSWORD=vlab_password
      - QUEUE_CONNECTION=database
      - LOG_CHANNEL=stderr
      - LOG_STACK=stderr
      - LOG_LEVEL=warning
      - LOG_HTTP_ENABLED=true
      - LOG_HTTP_CHANNEL=api_stderr
      - LOG_API_LEVEL=info
    entrypoint: ["php", "artisan", "queue:work", "database", "--queue=dominio", "--sleep=1", "--tries=3", "--max-time=3600", "--no-interaction"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: vlab_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    command: >
      sh -c "
        npm install &&
        npm run dev -- --host 0.0.0.0
      "

volumes:
  vlab_pgdata:
  vlab_vendor:
